include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - .cache/**
    - .dart_tool/**
    - build/**
    - fastlane/**
    - lib/bbcode/generated/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Vendored third-party packages (see third_party/*/PATCHES.md). Their own
    # test suites depend on `package:test`, which this project does not provide.
    - third_party/**
