org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# 本仓库只发 arm64，靠 app/build.gradle 的 splits.abi 限制。
# Flutter 的 Gradle 插件默认会在没开 --split-per-abi 时把 ndk.abiFilters
# 强制清空并填成全部 ABI，与 splits 冲突（AGP 报 Conflicting configuration）。
# 这个属性让插件跳过那段逻辑，flutter CLI 没有对外暴露对应参数。
disable-abi-filtering=true
