plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release signing material. Kept outside version control; CI writes it from
// secrets before building. Without it we fall back to the debug key so that a
// plain `flutter run --release` keeps working.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.example.kazumi"
    compileSdk flutter.compileSdkVersion
    // Use the highest NDK required by the native plugins. Newer NDKs remain
    // backward compatible with plugins that declare an older version.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // Local mod build: uses a distinct application id so it can be installed
        // side by side with the official Kazumi package.
        applicationId "com.patch.kazumi"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // 本版只发 arm64。
    //
    // 不能靠 defaultConfig.ndk.abiFilters —— Flutter 的 Gradle 插件在没开
    // --split-per-abi 时会无条件 abiFilters.clear() 再填上全部 ABI
    //（FlutterPlugin.kt configureAbiWithoutSplits，注释说用户配置优先，代码是反的）。
    // 绕法是 android/gradle.properties 里的 disable-abi-filtering=true，
    // 让插件跳过那段，交给下面的 splits 决定装哪些 ABI。
    //
    // 用 splits 而不是 --split-per-abi：两者产物都叫 app-arm64-v8a-release.apk，
    // 但命令行参数只对本次构建生效，splits 写在这里对所有入口一致
    //（IDE、CI、build_apk.ps1 都一样）。
    //
    // 副作用：文件末尾的 abiCodes 会生效，arm64 的 versionCode 变成
    // versionCode * 10 + 2（2.4.1 -> 204012）。升级比较仍然单调递增，无影响。
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a"
            // 不额外产出 universal apk，只留单独的那个
            universalApk false
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Sign with the local release key when it is present so in-app
            // updates can upgrade over an installed build. CI provides the same
            // key from secrets; without it we fall back to the debug key.
            signingConfig hasReleaseKeystore
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {}

// F-droid splits APKs by ABI, and requires different versionCode for each ABI.
// For flutter version X.Y.Z, version code is X0Y0ZA, where A is the ABI code.
// See:
// * https://developer.android.com/build/gradle-tips
// * https://developer.android.com/studio/build/configure-apk-splits
// * https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/im.nfc.nfsee.yml
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 4]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}
