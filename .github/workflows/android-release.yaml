---
    name: "android release"

    # 个人自用：只出 Android APK，并挂到 tag 对应的 Release 上。
    # App 内的「检查更新」读 /releases/latest，所以 tag 必须是裸版本号
    # （2.4.0 这种），不能带 v 前缀 —— needUpdate() 按 '.' 分段 int.parse。
    on:
      push:
        tags:
          - "[0-9]*"
      workflow_dispatch:
        inputs:
          tag:
            description: '要发布的版本号，必须与 pubspec.yaml 的 version 一致，如 2.4.0'
            required: true

    env:
      DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
      DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
      KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
      KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}

    jobs:
      build-android:
        name: "build & release apk"
        runs-on: "ubuntu-latest"
        permissions:
          contents: write
        steps:
          - name: Resolve tag
            id: tag
            run: |
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
              else
                echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
              fi
            shell: bash

          - name: Clone repository
            uses: actions/checkout@v4

          - name: Verify tag matches pubspec version
            run: |
              pub_version=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d+ -f1)
              if [ "$pub_version" != "${{ steps.tag.outputs.tag }}" ]; then
                echo "tag ${{ steps.tag.outputs.tag }} != pubspec version $pub_version"
                exit 1
              fi
            shell: bash

          - name: Set up JDK 17
            uses: actions/setup-java@v4
            with:
              java-version: '17'
              distribution: 'temurin'

          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml

          - name: Restore release keystore
            env:
              KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
              KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
              KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
              KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
            run: |
              if [ -z "$KEYSTORE_BASE64" ]; then
                echo "缺少 KEYSTORE_BASE64，无法出可覆盖安装的 Release"
                exit 1
              fi
              echo "$KEYSTORE_BASE64" | base64 -d > android/kazumi-release.jks
              printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=kazumi-release.jks\n' \
                "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            shell: bash

          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash

          - name: Build APK
            run: >-
              flutter build apk --release
              --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
              --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
              --dart-define=KAZUMI_APPID=$KAZUMI_APPID
              --dart-define=KAZUMI_KEY=$KAZUMI_KEY
            shell: bash

          - name: Package APK
            run: cp build/app/outputs/flutter-apk/app-release.apk Kazumi_android_${{ steps.tag.outputs.tag }}.apk
            shell: bash

          - name: Remove signing material
            if: always()
            run: rm -f android/kazumi-release.jks android/key.properties
            shell: bash

          - name: Create release
            uses: softprops/action-gh-release@v2
            with:
              tag_name: ${{ steps.tag.outputs.tag }}
              name: ${{ steps.tag.outputs.tag }}
              body: |
                Kazumi Plus ${{ steps.tag.outputs.tag }}（个人自用，非官方）

                APK 已用正式 release 签名，可直接覆盖安装旧版本。
                首次从 debug 签名的旧版升级会失败，需先卸载旧版。
              files: Kazumi_android_${{ steps.tag.outputs.tag }}.apk
              fail_on_unmatched_files: true
