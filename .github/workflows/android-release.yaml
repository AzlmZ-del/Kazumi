---
    name: "android release"

    # 个人自用：只出 Android APK，并挂到 tag 对应的 Release 上。
    # App 内的「检查更新」读 /releases/latest，所以 tag 必须是裸版本号
    # （2.4.0 这种），不能带 v 前缀 —— needUpdate() 按 '.' 分段 int.parse。
    #
    # 速度优化（相比最初的 8 分半）：
    #   1. 只出 arm64 —— 三个 ABI 各编一遍 C++ bridge 和 AOT，单架构省掉 2/3
    #   2. 缓存 Gradle 发行包 + 依赖 —— 冷启动那 119 秒的空档全在这里
    #   3. 缓存 PUB_CACHE —— build 步骤内隐式 pub get 不再重新下载
    #   4. 缓存 Flutter SDK
    #   5. concurrency 会取消同一 tag 的重复触发
    on:
      push:
        tags:
          - "[0-9]*"
      workflow_dispatch:
        inputs:
          tag:
            description: '要发布的版本号，必须与 pubspec.yaml 的 version 一致，如 2.4.0'
            required: true

    # 同一个 tag 重复触发时，取消旧的那次，避免排队
    concurrency:
      group: android-release-${{ github.event.inputs.tag || github.ref_name }}
      cancel-in-progress: true

    env:
      DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
      DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
      KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
      KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}
      # 关掉 daemon：一次性构建用不着，能省几百 MB 内存
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true

    jobs:
      build-android:
        name: "build & release apk"
        runs-on: "ubuntu-latest"
        timeout-minutes: 25
        permissions:
          contents: write
        steps:
          - name: Resolve tag
            id: tag
            run: |
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
              else
                echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
              fi
            shell: bash

          - name: Clone repository
            uses: actions/checkout@v4

          - name: Verify tag matches pubspec version
            run: |
              pub_version=$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//' | cut -d+ -f1)
              if [ "$pub_version" != "${{ steps.tag.outputs.tag }}" ]; then
                echo "tag ${{ steps.tag.outputs.tag }} != pubspec version $pub_version"
                exit 1
              fi
            shell: bash

          - name: Set up JDK 17
            uses: actions/setup-java@v4
            with:
              java-version: '17'
              distribution: 'temurin'

          - name: Set up Flutter
            uses: subosito/flutter-action@v2.16.0
            with:
              channel: stable
              flutter-version-file: pubspec.yaml
              cache: true

          # Gradle 发行包 + 依赖缓存。首次仍然要下，之后命中就跳过那 119 秒空档。
          # key 里带上 wrapper 与 gradle 文件的 hash，改了依赖会自动换一套。
          - name: Cache Gradle
            uses: actions/cache@v4
            with:
              path: |
                ~/.gradle/caches
                ~/.gradle/wrapper
              key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/**/*.gradle', 'android/gradle.properties', 'pubspec.lock') }}
              restore-keys: |
                gradle-${{ runner.os }}-

          - name: Cache pub
            uses: actions/cache@v4
            with:
              path: ~/.pub-cache
              key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
              restore-keys: |
                pub-${{ runner.os }}-

          # NDK 28.2 不在 runner 预装列表里（预装 27.3 / 29.0 / 30.0），
          # 每次都要现下 20 多秒。单独缓存这个目录就能跳过。
          - name: Cache NDK 28.2
            id: ndk-cache
            uses: actions/cache@v4
            with:
              path: /usr/local/lib/android/sdk/ndk/28.2.13676358
              key: ndk-28.2.13676358-${{ runner.os }}

          - name: Restore release keystore
            env:
              KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
              KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
              KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
              KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
            run: |
              if [ -z "$KEYSTORE_BASE64" ]; then
                echo "缺少 KEYSTORE_BASE64，无法出可覆盖安装的 Release"
                exit 1
              fi
              echo "$KEYSTORE_BASE64" | base64 -d > android/kazumi-release.jks
              printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=kazumi-release.jks\n' \
                "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            shell: bash

          - name: Get Flutter dependencies
            run: flutter pub get
            shell: bash

          # 只出 arm64：--split-per-abi 让 Gradle 只产出 arm64-v8a 那个 APK，
          # 产物名变成 app-arm64-v8a-release.apk。
          # 这个标志不能省 —— 没有它 flutter 工具链还是去找 app-release.apk，
          # 找不到就报 "Gradle build failed to produce an .apk file"。
          - name: Build APK
            run: >-
              flutter build apk --release
              --split-per-abi
              --target-platform android-arm64
              --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
              --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
              --dart-define=KAZUMI_APPID=$KAZUMI_APPID
              --dart-define=KAZUMI_KEY=$KAZUMI_KEY
            shell: bash

          # getUpdateFilePatterns(androidApk) == ['android', '.apk']：资产名必须
          # 同时含 "android" 与 ".apk"，否则 App 内更新找不到资产。
          # 只上传这一个附件 —— App 内更新校验用的是 GitHub 自动生成的
          # asset.digest，不需要额外的 .sha256 文件。
          - name: Package APK
            run: |
              cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
                "KazumiPlus-${{ steps.tag.outputs.tag }}-android-arm64-v8a.apk"
            shell: bash

          - name: Remove signing material
            if: always()
            run: rm -f android/kazumi-release.jks android/key.properties
            shell: bash

          - name: Create release
            uses: softprops/action-gh-release@v2
            with:
              tag_name: ${{ steps.tag.outputs.tag }}
              name: ${{ steps.tag.outputs.tag }}
              body: |
                Kazumi Plus ${{ steps.tag.outputs.tag }}（个人自用，非官方）

                - `arm64-v8a`，只这一种；32 位老设备（armeabi-v7a / x86）装不了
                - APK 用正式 release 签名，可覆盖安装
                - 首次从 debug 签名的旧版升级会失败，需先卸载旧版
              files: KazumiPlus-${{ steps.tag.outputs.tag }}-android-arm64-v8a.apk
              fail_on_unmatched_files: true
